name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vsce package --out spec-renderer.vsix
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath spec-renderer.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish spec-renderer.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
